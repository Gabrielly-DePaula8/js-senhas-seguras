<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" contet="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="cadeado fechado">
            <h2 class="titulo-principal">Gerador de senhas </h2>
            <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h3>
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Número de caracteres</h4>
                    <div class="parametros-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha">Caracteristica da senha</h4>
                    <div class="parametro-senha-checkbox">
                        <input type="checkbox" name="maiusculo">
                        <label for="maiusculo">Letras maíusculas </label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input type="checkbox" name="minusculo">
                        <label for="maiusculo">Letras minusculas </label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input type="checkbox" name="numeros">
                        <label for="maiusculo">Números </label>
                    </div>~

                    <div class="parametro-senha-checkbox">
                        <input type="checkbox" name="simbolos">
                        <label for="maiusculo">Simbolos </label>
                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>
                </div>
            </div>
        </div>
    </section>

</body>
